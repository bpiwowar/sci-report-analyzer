name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # Required to update release notes
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed by git-cliff for the commits since the last tag

      - name: Generate changelog for this release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set the version from the release tag (v1.2.3 -> 1.2.3)
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build python package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
